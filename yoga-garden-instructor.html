<style>

:root{
  --paper:#fffaf6;
  --bg:#f7f2ed;

  --lilac:#eadff1;
  --lilac-soft:#f5eef7;

  --plum:#87507f;
  --plum-dark:#55334f;

  --green:#4b825f;
  --green-dark:#315d42;
  --green-soft:#e8f1ea;

  --muted:#756d72;

  --line:rgba(85,51,79,.13);
}


*{
  box-sizing:border-box;
}


body{
  margin:0;

  background:var(--bg);

  color:#302b2f;

  font-family:"DM Sans",sans-serif;
}


a{
  color:inherit;
  text-decoration:none;
}


button{
  font:inherit;
  cursor:pointer;
}


h1,
h2,
h3{
  margin:0;

  font-family:"Playfair Display",Georgia,serif;

  color:var(--plum-dark);

  font-weight:500;

  letter-spacing:-.035em;
}


.eyebrow{
  font-size:10px;

  text-transform:uppercase;

  letter-spacing:.12em;

  color:var(--green);

  font-weight:700;
}


.muted{
  color:var(--muted);
}


.small{
  font-size:12px;
}



/* ==========================
   DEMO BAR
========================== */

.demo{
  min-height:34px;

  padding:6px 18px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:22px;

  background:#382738;

  color:white;

  font-size:12px;
}


.demo a{
  opacity:.86;
}


.demo a:hover{
  opacity:1;
}



/* ==========================
   LAYOUT
========================== */

.shell{
  display:grid;

  grid-template-columns:235px 1fr;

  min-height:calc(100vh - 34px);
}



/* ==========================
   SIDEBAR
========================== */

.side{
  background:#312332;

  color:white;

  padding:22px 18px;
}


.side-logo{
  display:flex;

  justify-content:center;

  align-items:center;

  min-height:105px;

  margin-bottom:16px;
}


.side-logo img{
  width:158px;

  max-height:100px;

  object-fit:contain;
}


.side-nav{
  display:grid;

  gap:5px;
}


.side-nav a,
.side-nav button{
  display:block;

  width:100%;

  padding:10px 11px;

  border:0;

  border-radius:10px;

  background:transparent;

  color:#eee2ee;

  text-align:left;

  font-size:13px;
}


.side-nav a:hover,
.side-nav button:hover,
.side-nav .active{
  background:rgba(255,255,255,.09);
}



/* ==========================
   MAIN
========================== */

.main{
  padding:34px 38px 60px;
}


.top{
  display:flex;

  justify-content:space-between;

  align-items:end;

  gap:20px;

  margin-bottom:17px;
}


h1{
  margin:5px 0 4px;

  font-size:clamp(44px,5vw,69px);

  line-height:.97;
}
